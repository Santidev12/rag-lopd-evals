[project]
name = "rag-lopd-evals"
version = "0.1.0"
description = "RAG evaluado sobre normativa española de protección de datos: RGPD, LOPDGDD y resoluciones de la AEPD"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Santiago Pulido Díaz" }]
keywords = ["rag", "evals", "retrieval", "rgpd", "lopdgdd", "legal-nlp", "spanish"]

dependencies = [
    "httpx>=0.27",
    "lxml>=5.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
]

[project.scripts]
rag-lopd = "rag_lopd.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_lopd"]

# ---------------------------------------------------------------------------
# ruff hace de linter Y de formateador: sustituye a black + flake8 + isort.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes: variables sin usar, imports muertos
    "I",       # isort: orden de imports
    "UP",      # pyupgrade: sintaxis moderna
    "B",       # bugbear: fallos sutiles (mutables por defecto, etc.)
    "SIM",     # simplify
    "RUF",     # reglas propias de ruff
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
